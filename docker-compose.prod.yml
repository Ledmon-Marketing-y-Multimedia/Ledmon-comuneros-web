# Producción — front comuneros (Next.js 16, salida standalone) tras Traefik en
# https://comuneros.montesmarcon.com.
#
# La URL de la API va HORNEADA en el bundle (build-arg NEXT_PUBLIC_API_URL): el
# navegador llama directamente a api-comuneros.montesmarcon.com, así que la API
# debe permitir este origen por CORS (CORS_ALLOWED_ORIGINS en su .env). No hace
# falta red interna con la API ni puertos publicados al host.
#
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api-comuneros.montesmarcon.com/comuneros/api/v1
    image: ledmon-comuneros-web:prod
    container_name: ledmon-comuneros-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - traefik-public
    healthcheck:
      # /login es la única página pública; "/" redirige y exige sesión.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.comuneros-web.loadbalancer.server.port=3000

      - traefik.http.routers.comuneros-web-http.rule=Host(`comuneros.montesmarcon.com`)
      - traefik.http.routers.comuneros-web-http.entrypoints=http
      - traefik.http.routers.comuneros-web-http.middlewares=https-redirect

      - traefik.http.routers.comuneros-web-https.rule=Host(`comuneros.montesmarcon.com`)
      - traefik.http.routers.comuneros-web-https.entrypoints=https
      - traefik.http.routers.comuneros-web-https.tls=true
      - traefik.http.routers.comuneros-web-https.tls.certresolver=le

networks:
  traefik-public:
    external: true
