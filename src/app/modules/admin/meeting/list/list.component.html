<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <div class="flex-auto h-full bg-card dark:bg-transparent">
        <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
            <!-- Title -->
            <div class="text-4xl font-extrabold tracking-tight">Reuniones</div>
            <!-- Actions -->
            <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
                <!-- Search -->
                <mat-form-field
                    class="fuse-mat-dense fuse-mat-rounded min-w-30 md:min-w-64"
                    [subscriptSizing]="'dynamic'">
                    <mat-icon
                        class="icon-size-5"
                        matPrefix
                        [svgIcon]="'heroicons_solid:search'"></mat-icon>
                    <input
                        matInput
                        [formControl]="searchInputControl"
                        [autocomplete]="'off'"
                        [placeholder]="">
                </mat-form-field>
                <!-- Add user button -->
                <button
                    class="ml-4"
                    mat-flat-button
                    [routerLink]="'new'"
                    [color]="'primary'"
                    >
                    <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                    <span class="ml-2 mr-1">Nueva</span>
                </button>
            </div>
        </div>
        <div class="flex flex-auto overflow-hidden">

            <!-- Annoucement list -->
            <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden sm:overflow-y-auto">
                <ng-container *ngIf="meetings">
                    <ng-container *ngIf="meetings.length > 0; else noAnnoucements">
                        <div class="grid">
                            <!-- Header -->
                            <div
                                class="meeting-grid z-10 sticky top-0 grid gap-4 py-4 px-6 md:px-8 shadow text-md font-semibold text-secondary bg-gray-50 dark:bg-black dark:bg-opacity-5"
                                matSort
                                matSortDisableClear>
                                <div [mat-sort-header]="'name'">Titulo</div>
                                <div
                                    class="md:block"
                                    [mat-sort-header]="'status'">
                                    Estado
                                </div>

                                <div
                                    class="hidden md:block"
                                    [mat-sort-header]="'createdAt'">
                                    Fecha
                                </div>
                            </div>
                            <!-- Rows -->
                            <ng-container *ngIf="meetings">
                                <ng-container *ngFor="let meeting of meetings; trackBy: trackByFn">
                                    <div [routerLink]="meeting.id" class="user-grid grid select-none hover:bg-gray-100 dark:hover:bg-hover items-center gap-4 py-3 px-6 md:px-8 border-b">

                                        <!-- Name -->
                                        <div class="truncate">
                                            {{meeting.name}}
                                        </div>

                                        <!-- Registro -->
                                        <div class="hidden md:block">
                                            {{ meeting.status }}
                                        </div>

                                        <!-- Registro -->
                                        <div class="hidden md:block">
                                            {{ meeting.createdAt }}
                                        </div>

                                    </div>
                                </ng-container>
                            </ng-container>
                        </div>



                    </ng-container>
                </ng-container>

                <ng-template #noAnnoucements>
                    <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">{{"LAYOUT.COMPANY.USERS.NO_CASES" | transloco}}</div>
                </ng-template>

            </div>

        </div>
    </div>
</div>
