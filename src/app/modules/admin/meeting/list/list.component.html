<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

    <mat-drawer-container
        class="flex-auto h-full bg-card dark:bg-transparent"
        (backdropClick)="onBackdropClicked()">

        <!-- Drawer -->
        <mat-drawer
            class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="false"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer>
            <router-outlet></router-outlet>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">

            <!-- Main -->
            <div class="flex flex-col flex-auto">

                <!-- Header -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between py-8 px-6 md:px-8">
                    <!-- Title -->
                    <div>
                        <div class="text-4xl font-extrabold tracking-tight leading-none">Meeting</div>
                        <div class="ml-0.5 font-medium text-secondary">
                            <span *ngIf="meetingCount.incomplete === 0">All meeting completed!</span>
                            <span *ngIf="meetingCount.incomplete !== 0">{{meetingCount.incomplete}} remaining meeting</span>
                        </div>
                    </div>
                    <!-- Actions -->
                    <div class="mt-4 sm:mt-0">
                        <button
                            class="ml-3"
                            mat-flat-button
                            [color]="'primary'"
                            (click)="createMeeting()"
                            [matTooltip]="'Shortcut: Ctrl + /'">
                            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                            <span class="ml-2 mr-1">Add Meeting</span>
                        </button>
                    </div>
                </div>

                <!-- Meeting list -->
                <ng-container *ngIf="meeting && meeting.length > 0; else noMeeting">
                    <div
                        class="divide-y"
                    >

                        <!-- Meeting -->
                        <ng-container *ngFor="let meeting of meeting; let first = first; trackBy: trackByFn">
                            <div
                                [id]="'meeting-' + meeting.id"
                                class="group w-full select-none h-16 hover:bg-gray-100 dark:hover:bg-hover"
                                [class.border-t]="first">

                                <!-- Meeting content -->
                                <div class="relative flex items-center h-full pl-10">

                                    <!-- Selected indicator -->
                                    <ng-container *ngIf="selectedMeeting && selectedMeeting.id === meeting.id">
                                        <div class="z-10 absolute -top-px right-0 -bottom-px flex flex-0 w-1 bg-primary"></div>
                                    </ng-container>

                                    <!-- Complete meeting button -->
                                    <button
                                        class="mr-2 -ml-2.5 leading-none"
                                        *ngIf="meeting.type === 'task'"
                                        (click)="toggleCompleted(meeting)"
                                        mat-icon-button>
                                        <ng-container *ngIf="meeting.completed">
                                            <mat-icon
                                                class="text-primary"
                                                [svgIcon]="'heroicons_outline:check-circle'"></mat-icon>
                                        </ng-container>
                                        <ng-container *ngIf="!meeting.completed">
                                            <mat-icon
                                                class="text-hint"
                                                [svgIcon]="'heroicons_outline:check-circle'"></mat-icon>
                                        </ng-container>
                                    </button>

                                    <!-- Meeting link -->
                                    <a
                                        class="flex flex-auto items-center min-w-0 h-full pr-7"
                                        [routerLink]="[meeting.id]">
                                        <!-- Title & Placeholder -->
                                        <div class="flex-auto mr-2 truncate">
                                            <ng-container *ngIf="meeting.name">
                                                <span>{{meeting.name}}</span>
                                            </ng-container>
                                            <ng-container *ngIf="!meeting.name">
                                                <span class="select-none text-hint">{{meeting.type | titlecase}} title</span>
                                            </ng-container>
                                        </div>
                                        <!-- Priority -->
                                        <ng-container *ngIf="meeting.type === 'meeting'">
                                            <div class="w-4 h-4 mr-3">
                                                <!-- Low -->
                                                <mat-icon
                                                    class="icon-size-4 text-green-600 dark:text-green-400"
                                                    *ngIf="meeting.priority === 0"
                                                    [svgIcon]="'heroicons_mini:arrow-long-down'"
                                                    [title]="'Low'"></mat-icon>
                                                <!-- High -->
                                                <mat-icon
                                                    class="icon-size-4 text-red-600 dark:text-red-400"
                                                    *ngIf="meeting.priority === 2"
                                                    [svgIcon]="'heroicons_mini:arrow-long-up'"
                                                    [title]="'High'"></mat-icon>
                                            </div>
                                        </ng-container>
                                        <!-- Due date -->
                                        <div
                                            class="text-sm whitespace-nowrap text-secondary"
                                            *ngIf="meeting.type === 'meeting'">
                                            {{meeting.dueDate | date:'LLL dd'}}
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </ng-container>
                    </div>

                </ng-container>

                <ng-template #noMeeting>
                    <div class="flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
                        <mat-icon
                            class="icon-size-24"
                            [svgIcon]="'heroicons_outline:clipboard-document-list'"></mat-icon>
                        <div class="mt-4 text-2xl font-semibold tracking-tight text-secondary">Add a meeting to start planning!</div>
                    </div>
                </ng-template>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>
