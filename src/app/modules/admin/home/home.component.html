<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
<div class="bg-white">

    <main class="isolate">
      <!-- Hero section -->
      <div class="relative h-screen isolate -z-10 overflow-hidden bg-gradient-to-b from-indigo-100/20 py-8 lg:py-22 my-auto">
        <div class="absolute inset-y-0 right-1/2 -z-10 -mr-96 w-[200%] origin-top-right skew-x-[-30deg] bg-white shadow-xl shadow-indigo-600/10 ring-1 ring-indigo-50 sm:-mr-80 lg:-mr-96" aria-hidden="true"></div>
        <div class="mx-auto max-w-7xl px-6 lg:px-8">
            <section class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <a [routerLink]="'/reuniones'" class="relative h-30 lg:h-40 flex flex-col overflow-hidden rounded-lg p-6 hover:opacity-75 xl:w-auto">
                    <span aria-hidden="true" class="absolute inset-0">
                        <img src="https://www.solufincas.com/wp-content/uploads/2023/06/cuantos-vecinos-hacen-falta-para-convocar-reunion.jpeg" alt="" class="h-full w-full object-cover object-center">
                    </span>
                    <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-gray-800 opacity-50"></span>
                    <span class="relative mt-auto text-center text-xl font-bold text-white">Reuniones</span>
                </a>
            </section>
            <section class="xl:mx-auto xl:max-w-7xl xl:px-8 mt-8">
                <div class="mt-4 flow-root">
                <div class="-my-2">
                    <div class="relative box-content h-60 overflow-x-auto py-2 xl:overflow-visible">
                    <div class="grid grid-cols-2 space-x-8 px-4 sm:px-6 lg:px-8 relative xl:gap-x-8 xl:space-x-0 xl:px-0">
                        <a [routerLink]="'/comuneros'" class="relative flex h-60 flex-col overflow-hidden rounded-lg p-6 hover:opacity-75">
                            <span aria-hidden="true" class="absolute inset-0">
                                <img src="https://media.quincemil.com/imagenes/2023/09/01193525/ancianos_gallegos-1706x960.jpg" alt="" class="h-full w-full object-cover object-center">
                            </span>
                            <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-gray-800 opacity-50"></span>
                            <span class="relative mt-auto text-center text-xl font-bold text-white">Comuneros</span>
                        </a>
                        <a [routerLink]="'/lugares'" class="relative flex h-60 flex-col overflow-hidden rounded-lg p-6 hover:opacity-75">
                            <span aria-hidden="true" class="absolute inset-0">
                                <img src="https://i.pinimg.com/originals/ff/6a/03/ff6a03e8a4b6264f79fa0c30f4ff3e8c.jpg" alt="" class="h-full w-full object-cover object-center">
                            </span>
                            <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-gray-800 opacity-50"></span>
                            <span class="relative mt-auto text-center text-xl font-bold text-white">Lugares</span>
                        </a>
                    </div>
                </div>
                </div>
                </div>
            </section>
            <section class="mx-auto max-w-7xl mt-8 px-4 sm:px-6 lg:px-8">
                <a [routerLink]="'/announcements'" class="relative h-30 lg:h-40 flex flex-col overflow-hidden rounded-lg p-6 hover:opacity-75 xl:w-auto">
                    <span aria-hidden="true" class="absolute inset-0">
                        <img src="https://assets.easymailing.com/cms/2023/03/03105631/carta-informativa-ejemplo-twitter.jpg" alt="" class="h-full w-full object-cover object-center">
                    </span>
                    <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-gray-800 opacity-50"></span>
                    <span class="relative mt-auto text-center text-xl font-bold text-white">Comunicaciones</span>
                </a>
            </section>
        </div>
        <div class="absolute inset-x-0 bottom-0 -z-10 h-24 bg-gradient-to-t from-white sm:h-32"></div>
      </div>
    </main>
  </div>

</div>
