<div class="flex flex-col w-full">

    <!-- View mode -->
    <ng-container *ngIf="!editMode">

        <!-- Header -->
        <div class="relative w-full h-40 sm:h-48 px-8 sm:px-12 bg-accent-100 dark:bg-accent-700">
            <!-- Background -->
            <ng-container>
                <img
                    class="absolute inset-0 object-cover w-full h-full opacity-60"
                    [src]="'/assets/images/marcon_desde_salgueiral.jpg'">
            </ng-container>
            <!-- Close button -->
            <div class="flex items-center justify-end w-full max-w-3xl mx-auto pt-6">
                <a
                    mat-icon-button
                    [matTooltip]="'Close'"
                    [routerLink]="['../']">
                    <mat-icon
                        class="text-white"
                        [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
                </a>
            </div>
        </div>

        <!-- lugar -->
        <div class="relative flex flex-col flex-auto items-center p-6 pt-0 sm:p-12 sm:pt-0">
            <div class="w-full max-w-3xl">

                <!-- Avatar and actions -->
                <div class="flex flex-auto items-end -mt-16">
                    <!-- Avatar -->
                    <div class="flex items-center justify-center w-32 h-32 rounded-full overflow-hidden ring-4 ring-bg-card">
                        <img
                            class="object-cover w-full h-full"
                            *ngIf="lugar.avatar"
                            [src]="lugar.avatar">
                        <div
                            class="flex items-center justify-center w-full h-full rounded overflow-hidden uppercase text-8xl font-bold leading-none bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200"
                            *ngIf="!lugar.avatar">
                            {{lugar.address?.charAt(0)}}
                        </div>
                    </div>
                    <!-- Actions -->
                    <div class="flex items-center ml-auto mb-1">
                        <button
                            mat-stroked-button
                            (click)="toggleEditMode(true)">
                            <mat-icon
                                class="icon-size-5"
                                [svgIcon]="'heroicons_solid:pencil-square'"></mat-icon>
                            <span class="ml-2">Edit</span>
                        </button>
                    </div>
                </div>

                <!-- Name -->
                <div class="mt-3 text-4xl font-bold truncate">{{lugar.address}}</div>

                <div class="flex flex-col mt-4 pt-6 border-t space-y-8">
                    <!-- Zona -->
                    <ng-container *ngIf="lugar.zona">
                        <div class="flex sm:items-center">
                            <mat-icon [svgIcon]="'heroicons_outline:briefcase'"></mat-icon>
                            <div class="ml-6 leading-6">{{lugar.zona}}</div>
                        </div>
                    </ng-container>

                    <!-- Población -->
                    <ng-container *ngIf="lugar.poblacion">
                        <div class="flex sm:items-center">
                            <mat-icon [svgIcon]="'heroicons_outline:building-office-2'"></mat-icon>
                            <div class="ml-6 leading-6">{{lugar.poblacion}}</div>
                        </div>
                    </ng-container>

                    <!-- CP -->
                    <ng-container *ngIf="lugar.cp">
                        <div class="flex sm:items-center">
                            <mat-icon [svgIcon]="'heroicons_outline:map-pin'"></mat-icon>
                            <div class="ml-6 leading-6">{{lugar.cp}}</div>
                        </div>
                    </ng-container>
                    <!-- Comunero -->
                    <ng-container *ngIf="comunero">
                        <div class="flex sm:items-center">
                            <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
                            <div class="ml-6 leading-6">{{comunero.user.name}} (Comunero)</div>
                        </div>
                    </ng-container>
                    <ng-container *ngFor="let autorizado of autorizados">
                        <div class="flex sm:items-center">
                            <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
                            <div class="ml-6 leading-6">{{autorizado.user.name}} (Autorizado)</div>
                        </div>
                    </ng-container>
                </div>

            </div>
        </div>
    </ng-container>

    <!-- Edit mode -->
    <ng-container *ngIf="editMode">

        <!-- Header -->
        <div class="relative w-full h-40 sm:h-48 px-8 sm:px-12 bg-accent-100 dark:bg-accent-700">
            <!-- Background -->
            <ng-container>
                <img
                    class="absolute inset-0 object-cover w-full h-full opacity-60"
                    [src]="'/assets/images/marcon_desde_salgueiral.jpg'">
            </ng-container>
            <!-- Close button -->
            <div class="flex items-center justify-end w-full max-w-3xl mx-auto pt-6">
                <a
                    mat-icon-button
                    [matTooltip]="'Close'"
                    [routerLink]="['../']">
                    <mat-icon
                        class="text-white"
                        [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
                </a>
            </div>
        </div>

        <!-- lugar form -->
        <div class="relative flex flex-col flex-auto items-center px-6 sm:px-12">
            <div class="w-full max-w-3xl">
                <form [formGroup]="lugarForm">

                    <!-- Dirección -->
                    <div class="mt-8">
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Dirección</mat-label>
                            <mat-icon
                                matPrefix
                                class="hidden sm:flex icon-size-5"
                                [svgIcon]="'heroicons_solid:briefcase'"></mat-icon>
                            <input
                                matInput
                                [formControlName]="'address'"
                                [placeholder]="'Dirección'">
                        </mat-form-field>
                    </div>

                    <!-- Zona -->
                    <div class="mt-8">
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Zona</mat-label>
                            <mat-icon
                                matPrefix
                                class="hidden sm:flex icon-size-5"
                                [svgIcon]="'heroicons_solid:building-office-2'"></mat-icon>
                            <input
                                matInput
                                [formControlName]="'zona'"
                                [placeholder]="'Zona'">
                        </mat-form-field>
                    </div>

                    <!-- Población -->
                    <div class="mt-8">
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Población</mat-label>
                            <mat-icon
                                matPrefix
                                class="hidden sm:flex icon-size-5"
                                [svgIcon]="'heroicons_solid:map-pin'"></mat-icon>
                            <input
                                matInput
                                [formControlName]="'poblacion'"
                                [placeholder]="'Población'">
                        </mat-form-field>
                    </div>

                    <!-- CP -->
                    <div class="mt-8">
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Código postal</mat-label>
                            <mat-icon
                                matPrefix
                                class="hidden sm:flex icon-size-5"
                                [svgIcon]="'heroicons_solid:map-pin'"></mat-icon>
                            <input
                                matInput
                                [formControlName]="'cp'"
                                [placeholder]="'Código postal'">
                        </mat-form-field>
                    </div>

                    <!-- Phone numbers -->
                    <div class="mt-8">
                        <mat-label class="mb-4" >Autorizados</mat-label>
                        <div class="space-y-4">
                            <ng-container *ngFor="let comunero of lugarForm.get('autorizados')['controls']; let i = index; let first = first; let last = last; trackBy: trackByFn">
                                <div class="relative flex">
                                    <mat-form-field
                                        class="flex-auto"
                                        [subscriptSizing]="'dynamic'">
                                        <mat-label *ngIf="first">Nombre y apellidos</mat-label>
                                        <input
                                            matInput
                                            [formControl]="comunero.get('name')"
                                            [placeholder]="'Nombre'">
                                    </mat-form-field>
                                    <mat-form-field
                                        class="flex-auto w-full max-w-24 sm:max-w-40 ml-2 sm:ml-4"
                                        [subscriptSizing]="'dynamic'">
                                        <mat-label *ngIf="first">DNI</mat-label>
                                        <mat-icon
                                            matPrefix
                                            class="hidden sm:flex icon-size-5"
                                            [svgIcon]="'heroicons_solid:tag'"></mat-icon>
                                        <input
                                            matInput
                                            [formControl]="comunero.get('dni')"
                                            [placeholder]="'DNI'">
                                    </mat-form-field>
                                    <!-- Remove phone number -->
                                    <ng-container *ngIf="!(first && last)">
                                        <div
                                            class="flex items-center w-10 pl-2"
                                            [ngClass]="{'mt-6': first}">
                                            <button
                                                class="w-8 h-8 min-h-8"
                                                mat-icon-button
                                                (click)="removeAutorizadoField(i)"
                                                matTooltip="Remove">
                                                <mat-icon
                                                    class="icon-size-5"
                                                    [svgIcon]="'heroicons_solid:trash'"></mat-icon>
                                            </button>
                                        </div>
                                    </ng-container>
                                </div>
                            </ng-container>
                        </div>
                        <div
                            class="group inline-flex items-center mt-2 -ml-4 py-2 px-4 rounded cursor-pointer"
                            (click)="addAutorizadoField()">
                            <mat-icon
                                class="icon-size-5"
                                [svgIcon]="'heroicons_solid:plus-circle'"></mat-icon>
                            <span class="ml-2 font-medium text-secondary group-hover:underline">Añade un autorizado</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center mt-10 -mx-6 sm:-mx-12 py-4 pr-4 pl-1 sm:pr-12 sm:pl-7 border-t bg-gray-50 dark:bg-transparent">
                        <!-- Delete -->
                        <button
                            mat-button
                            [color]="'warn'"
                            [matTooltip]="'Delete'"
                            (click)="deleteLugares()">
                            Delete
                        </button>
                        <!-- Cancel -->
                        <button
                            class="ml-auto"
                            mat-button
                            [matTooltip]="'Cancel'"
                            (click)="toggleEditMode(false)">
                            Cancel
                        </button>
                        <!-- Save -->
                        <button
                            class="ml-2"
                            mat-flat-button
                            [color]="'primary'"
                            [disabled]="lugarForm.invalid"
                            [matTooltip]="'Save'"
                            (click)="updateLugares()">
                            Save
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </ng-container>
</div>
