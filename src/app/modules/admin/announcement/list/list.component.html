<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">Comunicaciones</div>
        <!-- Actions -->
        <div class="flex flex-wrap gap-2 items-center mt-4 sm:mt-0 md:mt-4">
            <!-- Search -->
            <mat-form-field
                class="fuse-mat-dense fuse-mat-rounded w-full md:w-64"
                [subscriptSizing]="'dynamic'">
                <mat-icon
                    class="icon-size-5"
                    matPrefix
                    [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input
                    matInput
                    [formControl]="searchInputControl"
                    [autocomplete]="'off'"
                    [placeholder]="'Buscar comunicaciones'">
            </mat-form-field>
            <!-- Add user button -->
            <button
                class="w-full md:w-fit md:ml-4"
                mat-flat-button
                [routerLink]="'new'"
                [color]="'primary'"
                >
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Nueva comunicación</span>
            </button>
        </div>
    </div>
    <div class="flex flex-auto overflow-hidden">

        <!-- Annoucement list -->
        <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden sm:overflow-y-auto">
            <ng-container *ngIf="announcements">
                <ng-container *ngIf="announcements.length > 0; else noAnnoucements">
                    <div class="grid">
                        <!-- Header -->
                        <div
                            class="announcement-grid z-10 sticky top-0 grid gap-4 py-4 px-6 md:px-8 shadow text-md font-semibold text-secondary bg-gray-50 dark:bg-black dark:bg-opacity-5"
                            matSortDisableClear>
                            <div>Titulo</div>

                            <div>Usuario</div>

                            <div
                                class="hidden md:block">
                                Fecha
                            </div>
                        </div>
                        <!-- Rows -->
                        <ng-container *ngIf="announcements">
                            <ng-container *ngFor="let announcement of announcements; trackBy: trackByFn">
                                <div [routerLink]="announcement.id" class="announcement-grid grid select-none hover:bg-gray-100 dark:hover:bg-hover items-center gap-4 py-3 px-6 md:px-8 border-b cursor-pointer">

                                    <div class="truncate">
                                        {{announcement.title}}
                                    </div>

                                    <!-- User -->
                                    <div class="truncate">
                                        {{announcement.user.name}}
                                    </div>

                                    <!-- Registro -->
                                    <div class="hidden md:block">
                                        {{ announcement.createdAt | date }}
                                    </div>

                                </div>
                            </ng-container>
                        </ng-container>
                    </div>

                    <mat-paginator
                        class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                        [pageSizeOptions]="[5, 10, 25, 100]"
                        [pageSize]="5"
                        [showFirstLastButtons]="true">
                    </mat-paginator>

                </ng-container>
            </ng-container>

            <ng-template #noAnnoucements>
                <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">{{"LAYOUT.COMPANY.USERS.NO_CASES" | transloco}}</div>
            </ng-template>

        </div>

    </div>
</div>
